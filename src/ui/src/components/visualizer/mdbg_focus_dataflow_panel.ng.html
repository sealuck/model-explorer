<div class="section">
  <div class="header">Focus Dataflow</div>

  <form class="content" (submit)="$event.preventDefault()">
    <input
        #fileInput
        type="file"
        accept=".txt"
        hidden
        (change)="onFileSelected($event)">

    <button
        mat-stroked-button
        class="import-button import-seeds-section"
        type="button"
        (click)="fileInput.click()">
      Import seeds from file
    </button>

    <label class="seed-chip-list-section">
      Seeds
      <div class="chip-container">
        @for (chip of chipList; track chip) {
          <span
              #chipElement
              class="chip"
              [class.chip-added]="addedChips.has(chip)"
              [attr.data-token]="chip">
            <span class="chip-label">{{chip}}</span>
            <button
                class="chip-remove"
                type="button"
                aria-label="Remove seed"
                (click)="removeToken(chip)">
              &times;
            </button>
          </span>
        }
      </div>
    </label>

    @if (importWarnings.length > 0) {
      <div class="import-warning">
        Unresolved import lines:
        <ul>
          @for (warning of importWarnings; track $index) {
            <li>{{warning.line}}: {{warning.reason}}</li>
          }
        </ul>
      </div>
    }

    <label>
      Mode
      <select [formControl]="mode">
        <option value="union">Union</option>
        <option value="inter-seed">Inter-seed</option>
      </select>
    </label>

    <label>
      Context
      <select [formControl]="context">
        <option value="none">None</option>
        <option value="upstream">Upstream</option>
        <option value="downstream">Downstream</option>
        <option value="both">Both</option>
      </select>
    </label>

    <label>
      Context depth
      <select [formControl]="contextDepth">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="all">all</option>
      </select>
    </label>

    <button mat-flat-button
        color="primary"
        type="button"
        [disabled]="!canFocus"
        (click)="handleClickFocus()">
      Focus
    </button>
  </form>
</div>
