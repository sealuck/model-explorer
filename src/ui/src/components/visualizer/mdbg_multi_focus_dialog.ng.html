<div class="section">
  <div class="header">Multi-Focus Dataflow</div>

  <form class="content" (submit)="$event.preventDefault()">
    <input
        #fileInput
        type="file"
        accept=".txt"
        hidden
        (change)="onFileSelected($event)">

    <button
        mat-stroked-button
        class="import-button"
        type="button"
        (click)="fileInput.click()">
      Import from file
    </button>

    <label>
      SSA values
      <textarea
          placeholder="%0, %1"
          [formControl]="nodesSsas">
      </textarea>
    </label>

    @if (importWarnings.length > 0) {
      <div class="import-warning">
        Unresolved import lines:
        <ul>
          @for (warning of importWarnings; track $index) {
            <li>{{warning.line}}: {{warning.reason}}</li>
          }
        </ul>
      </div>
    }

    <label>
      Mode
      <select [formControl]="mode">
        <option value="union">Union</option>
        <option value="inter-seed">Inter-seed</option>
      </select>
    </label>

    @if (showDirection) {
      <label>
        Direction
        <select [formControl]="direction">
          <option value="both">both</option>
          <option value="backward">Upstream</option>
          <option value="forward">Downstream</option>
        </select>
      </label>
    }

    <label>
      Depth
      <input type="text" placeholder="all" [formControl]="depth">
    </label>

    <button mat-flat-button
        color="primary"
        type="button"
        [disabled]="!canFocus"
        (click)="handleClickFocus()">
      Focus
    </button>
  </form>
</div>
