<div class="section" [class.collapsed]="collapsed">
  <div class="header">
    <button mat-icon-button class="toggle" (click)="handleToggle()">
      <mat-icon>{{toggleIcon}}</mat-icon>
    </button>
    SSA Navigator
  </div>

  <div class="content">
    <div class="filter">
      <input placeholder="Filter op or SSA" [formControl]="filterControl">
      <mat-icon class="filter-icon">filter_alt</mat-icon>
      @if (filterControl.value) {
        <button mat-icon-button class="clear" (click)="handleClearFilter()">
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>

    <div class="table-container">
      <table border="0" cellspacing="0" cellpadding="0">
        <thead>
          <tr>
            <th class="op">Op</th>
            <th class="ssa">SSA</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of filteredRows; trackBy: trackByNodeId"
              (click)="handleClickRow(row)">
            <td class="op">{{row.opName}}</td>
            <td class="ssa">{{row.ssa}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
