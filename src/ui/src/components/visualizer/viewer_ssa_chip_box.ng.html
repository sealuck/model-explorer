<input
    #fileInput
    type="file"
    accept=".txt"
    hidden
    (change)="onFileSelected($event)">

<button
    mat-stroked-button
    class="import-button import-seeds-section"
    type="button"
    (click)="fileInput.click()">
  {{importButtonText}}
</button>

<label class="seed-chip-list-section">
  {{boxLabel}}
  <div class="chip-container" (click)="tokenInput.focus()">
    @for (chip of chipList; track chip.token) {
      <span
          #chipElement
          class="chip"
          [class.chip-added]="addedChips.has(chip.token)"
          [attr.data-token]="chip.token"
          [attr.title]="chip.token">
        <span class="chip-label">{{chip.label}}</span>
        <button
            class="chip-remove"
            type="button"
            [attr.aria-label]="removeAriaLabel"
            (click)="removeToken(chip.token)">
          &times;
        </button>
      </span>
    }
    <input
        #tokenInput
        class="token-input seed-input"
        type="text"
        [formControl]="tokenInputControl"
        [attr.aria-label]="inputAriaLabel"
        [placeholder]="inputPlaceholder"
        (keydown.enter)="$event.preventDefault(); commitTokenInput()"
        (keydown.backspace)="onTokenInputBackspace()">
  </div>
</label>

@if (showClearButton) {
  <button
      mat-flat-button
      color="primary"
      class="panel-action-button clear-seeds-button"
      type="button"
      [disabled]="chipList.length === 0"
      (click)="handleClearTokens()">
    {{clearButtonText}}
  </button>
}

@if (importWarnings.length > 0) {
  <div class="import-warning">
    Unresolved import lines:
    <ul>
      @for (warning of importWarnings; track $index) {
        <li>{{warning.line}}: {{warning.reason}}</li>
      }
    </ul>
  </div>
}
